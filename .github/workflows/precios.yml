name: Actualizar precios

on:
  schedule:
    # 00:25, 07:17 y 13:17 hora Argentina (UTC-3). El catálogo completo solo en la de las 07:17 (ver abajo).
    # La de las 00:25 toma los precios y promos del día nuevo apenas arranca.
    - cron: "25 3 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scrape.js
      - name: Guardar datos
        run: |
          git config user.name "superscrap-bot"
          git config user.email "superscrap-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # Catálogo completo de supermercado (búsqueda libre en la web y listas de compras).
      # Una vez por día (corrida de las 07:17, o a mano), para no cargar a los súper.
      # Va a la rama "catalogo", que se pisa en cada corrida (sin historial de git) para que el repo no crezca.
      # Si un súper falla, catalogo.js deja su archivo anterior (por eso se parte de la rama actual).
      # catalogo/historial/ guarda 30 días de precios (histórico de las listas): si la rama existe y no se pudo
      # clonar, se corta acá para no pisarla y perder ese histórico.
      - name: Catálogo completo
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * *'
        continue-on-error: true
        run: |
          DIR="$RUNNER_TEMP/catalogo"
          URL="https://github.com/${{ github.repository }}.git"
          # ls-remote: 0 = la rama existe, 2 = no existe (primera vez), otro = error de red (se corta).
          R=0; git ls-remote --exit-code --heads "$URL" catalogo >/dev/null || R=$?
          if [ $R -eq 0 ]; then git clone -q --depth 1 -b catalogo "$URL" "$DIR"
          elif [ $R -eq 2 ]; then mkdir -p "$DIR"
          else exit 1; fi
          rm -rf "$DIR/.git"
          node catalogo.js "$DIR"
          cd "$DIR"
          git init -q -b catalogo
          git config user.name "superscrap-bot"
          git config user.email "superscrap-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalogo

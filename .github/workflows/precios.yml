name: Actualizar precios

on:
  schedule:
    # 07:17 y 13:17 hora Argentina (UTC-3). El catálogo completo solo en la de las 07:17 (ver abajo).
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scrape.js
      - name: Guardar datos
        run: |
          git config user.name "superscrap-bot"
          git config user.email "superscrap-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # Catálogo completo de supermercado (búsqueda libre en la web y listas de compras).
      # Una vez por día (corrida de las 07:17, o a mano), para no cargar a los súper.
      # Va a la rama "catalogo", que se pisa en cada corrida (sin historial) para que el repo no crezca.
      # Si un súper falla, catalogo.js deja su archivo anterior (por eso se parte de la rama actual).
      - name: Catálogo completo
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * *'
        continue-on-error: true
        run: |
          DIR="$RUNNER_TEMP/catalogo"
          git clone -q --depth 1 -b catalogo "https://github.com/${{ github.repository }}.git" "$DIR" || mkdir -p "$DIR"
          rm -rf "$DIR/.git"
          node catalogo.js "$DIR"
          cd "$DIR"
          git init -q -b catalogo
          git config user.name "superscrap-bot"
          git config user.email "superscrap-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" catalogo
